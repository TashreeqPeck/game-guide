name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17"
          cache: npm
      - run: npm ci --engine-strict=false
      - name: commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }}
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx commitlint --from HEAD~1 --to HEAD
          fi
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17"
          cache: npm
      - run: npm ci --engine-strict=false
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: needs.release.outputs.new_release_published == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            ghcr.io/tashreeqpeck/game-guide:${{ needs.release.outputs.new_release_version }}
            ghcr.io/tashreeqpeck/game-guide:${{ needs.release.outputs.new_release_version.split('.')[0] }}.${{ needs.release.outputs.new_release_version.split('.')[1] }}
            ghcr.io/tashreeqpeck/game-guide:${{ needs.release.outputs.new_release_version.split('.')[0] }}
            ghcr.io/tashreeqpeck/game-guide:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max